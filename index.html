<style>

h3{font-size:.95rem;margin:0 0 8px;font-weight:700}
small,.muted{color:var(--muted)}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100%}
.side{background:var(--ink);color:#fff;padding:22px 14px;position:sticky;top:0;align-self:start;min-height:100dvh;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}

.side nav{display:flex;flex-direction:column;gap:2px}

.me{margin-top:auto;padding:12px 8px;border-top:1px solid rgba(255,255,255,.14);font-size:.86rem}

.top{display:flex;gap:12px;align-items:center;justify-content:flex-end;padding:12px 24px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top .mb{margin-right:auto;font-weight:800;display:none}

.ph{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card)}

.btn{font:inherit;font-weight:600;font-size:.9rem;border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 13px;border-radius:9px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden;margin-bottom:20px}
.kpi{padding:16px 18px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0;display:flex;flex-direction:column;gap:2px}

.vbar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--good)}

.big{font-size:1.3rem;font-weight:800}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.split>div{border:1px solid var(--line);border-radius:10px;padding:12px}
form .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.82rem;font-weight:600;color:var(--muted)}

input[type=file]{padding:4px;font-size:.78rem;max-width:190px}
.check{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.check li::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;background:var(--bad)}
.check li.ok::before{background:var(--good)}
.banner{padding:12px 14px;border-radius:10px;margin-bottom:16px;font-weight:600}
.banner.green{background:var(--goodbg)}.banner.amber{background:var(--warnbg)}.banner.red{background:var(--badbg)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:0}
.list a{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);text-decoration:none;font-size:.9rem}
.list a:last-child{border-bottom:0}
.bars{display:flex;align-items:flex-end;gap:3px;height:80px;margin:8px 0 4px}
.bars i{flex:1;background:var(--good);border-radius:3px 3px 0 0;min-height:2px}
.bars i.amber{background:var(--warn)}.bars i.red{background:var(--bad)}.bars i.none{background:var(--track)}
.mat td{text-align:right;font-size:.84rem}
.mat td.c-green{background:var(--goodbg)}.mat td.c-amber{background:var(--warnbg)}.mat td.c-red{background:var(--badbg)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
#toast.on{opacity:1}
.modal{position:fixed;inset:0;background:rgba(10,12,30,.5);display:grid;place-items:center;padding:16px;z-index:40}
.modal .panel{width:min(560px,100%);max-height:90vh;overflow:auto}
.modal textarea{width:100%;height:320px;font-size:.88rem}
.login{min-height:100dvh;display:grid;grid-template-columns:1fr 1fr}
.login .l{background:var(--ink);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between}
.login .l h1{font-size:2.6rem;max-width:12ch}
.login .l p{color:#C4C8EA;max-width:40ch}
.flow{display:flex;flex-wrap:wrap;gap:6px;font-size:.82rem;font-weight:700}
.flow span{border:1px solid rgba(255,255,255,.3);padding:4px 10px;border-radius:99px}
.login .r{padding:48px;display:flex;flex-direction:column;justify-content:center;gap:14px;max-width:520px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.roles button{font:inherit;text-align:left;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);cursor:pointer}
.roles button:hover{border-color:var(--ink2)}
.roles b{display:block}.roles small{font-size:.8rem}
.bnav{display:none}
@media (max-width:900px){
 .app{grid-template-columns:1fr}.side{display:none}
 .top{padding:10px 14px}.top .mb{display:block}.lm{display:inline}
 .page{padding:16px 14px 100px}
 .cols{grid-template-columns:1fr}
 .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:10;gap:4px}
 .bnav a{flex:1 0 auto;text-align:center;text-decoration:none;font-size:.8rem;font-weight:600;padding:9px 10px;border-radius:8px;color:var(--muted);white-space:nowrap}
 .bnav a.on{background:var(--ink2);color:#fff}
 .kv{font-size:1.3rem}
 .login{grid-template-columns:1fr}.login .l{padding:28px}.login .l h1{font-size:2rem}.login .r{padding:24px}
 .split{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<div id="app"></div>
<script>
/* =====================================================================
   SETTINGS — paste your Supabase details here.
   Leave both empty to run the app in DEMO mode with sample data.
   ===================================================================== */
const SUPABASE_URL = "https://wkhwfgsjsoafzlsqeqbv.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndraHdmZ3Nqc29hZnpsc3FlcWJ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3NjgxMDEsImV4cCI6MjEwNjM0NDEwMX0.TmDe-oSShWhtSOXhqFRE4x1HCuy4MBmbn4pI1WqnWEI";
const CLOSING_DEADLINE = "23:00";
const DEMO_DATE = "2026-09-30";

const LIVE = !!(SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase);
const sb = LIVE ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

/* ---------- small helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n = parseFloat(String(v ?? "").replace(/,/g, "")); return isFinite(n) ? n : 0; };
const int = v => Math.round(num(v));
const pad = n => String(n).padStart(2, "0");
const inr = n => "₹" + Math.round(n || 0).toLocaleString("en-IN");
const short = n => { n = n || 0; const a = Math.abs(n), s = n < 0 ? "−" : "";
  if (a >= 1e7) return s + "₹" + (a / 1e7).toFixed(2) + " Cr";
  if (a >= 1e5) return s + "₹" + (a / 1e5).toFixed(2) + " L";
  if (a >= 1e3) return s + "₹" + (a / 1e3).toFixed(1) + "K";
  return s + "₹" + Math.round(a); };
const pct = (n, d = 1) => (isFinite(n) ? n : 0).toFixed(d) + "%";
const signed = n => (n > 0 ? "+" : n < 0 ? "−" : "") + short(Math.abs(n)).replace("−", "");
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const monthOf = s => s.slice(0, 7) + "-01";
const daysIn = m => new Date(Date.UTC(+m.slice(0, 4), +m.slice(5, 7), 0)).getUTCDate();
const dayOf = s => +s.slice(8, 10);
const dateOf = (m, d) => m.slice(0, 8) + pad(d);
const prevMonth = m => { const d = new Date(Date.UTC(+m.slice(0, 4), +m.slice(5, 7) - 2, 1)); return d.toISOString().slice(0, 10); };
const fmtDate = s => new Date(s + "T00:00:00Z").toLocaleDateString("en-IN", { weekday: "short", day: "numeric", month: "long", year: "numeric", timeZone: "UTC" });
const fmtMonth = m => new Date(m + "T00:00:00Z").toLocaleDateString("en-IN", { month: "long", year: "numeric", timeZone: "UTC" });
const ROLES = { md: "MD", admin: "Admin", branch_manager: "Branch manager", hod: "Head of department", hr: "HR", accounts: "Accounts", audit: "Audit", pending: "Waiting for role" };
const EDIT = () => ["md", "admin"].includes(S.user.role);
const MGMT = () => ["md", "admin", "accounts", "audit"].includes(S.user.role);

/* ---------- app state ---------- */
const S = { user: null, month: null, date: null, view: "home", p: {}, mtd: false, D: {} };

/* =====================================================================
   DATA LAYER — same calls work for demo (in memory) and live (Supabase)
   ===================================================================== */
const MEM = { branches: [], departments: [], expense_heads: [], branch_month_targets: [], branch_head_targets: [], daily_closings: [], daily_expenses: [], actions: [], audit_logs: [], profiles: [] };
let _n = 0; const nid = () => "r" + (++_n);

function headDept(hid) { const h = MEM.expense_heads.find(x => x.id === hid); return h && h.department_id; }
function demoVisible(t, r) {
  const u = S.user, role = u.role;
  if (["md", "admin", "accounts", "audit"].includes(role)) return !(t === "audit_logs" && role === "accounts") && !(t === "profiles" && !["md", "admin", "audit"].includes(role));
  if (["branches", "departments", "expense_heads"].includes(t)) return true;
  if (t === "hr_attendance") return ["hr", "hod"].includes(role);
  if (role === "branch_manager") return !["audit_logs", "profiles"].includes(t) && r.branch_id === u.branch_id;
  if (role === "hod") {
    if (t === "branch_month_targets") return true;
    if (["branch_head_targets", "daily_expenses", "actions"].includes(t)) return headDept(r.expense_head_id) === u.department_id;
    return false;
  }
  if (role === "hr") return ["branch_month_targets", "branch_head_targets"].includes(t);
  return false;
}
function demoAudit(table, row_id, action, old_data, new_data) {
  MEM.audit_logs.unshift({ id: nid(), table_name: table, row_id, action, old_data, new_data, user_id: S.user && S.user.id, at: new Date().toISOString() });
}

async function fetchAll(table, build, order = "id") {
  let out = [], from = 0;
  for (;;) {
    let q = sb.from(table).select("*");
    if (build) q = build(q);
    const { data, error } = await q.order(order).range(from, from + 999);
    if (error) throw error;
    out = out.concat(data || []);
    if (!data || data.length < 1000) break;
    from += 1000;
  }
  return out;
}

const DB = {
  async list(table, f = {}) {
    if (!LIVE) {
      const src = table === "hr_attendance" ? "daily_closings" : table;
      let rows = MEM[src].filter(r => demoVisible(table, r));
      if (f.month) rows = rows.filter(r => r.month === f.month);
      if (f.from) rows = rows.filter(r => r.date >= f.from && r.date <= f.to);
      if (table === "hr_attendance") rows = rows.map(({ id, branch_id, date, staff_on_roll, present, on_leave, absent, status }) => ({ id, branch_id, date, staff_on_roll, present, on_leave, absent, status }));
      return rows.map(r => ({ ...r }));
    }
    if (table === "audit_logs") {
      const { data, error } = await sb.from("audit_logs").select("*").order("at", { ascending: false }).limit(300);
      if (error) throw error; return data;
    }
    return fetchAll(table, q => {
      if (f.month) q = q.eq("month", f.month);
      if (f.from) q = q.gte("date", f.from).lte("date", f.to);
      return q;
    }, table === "hr_attendance" ? "date" : "id");
  },
  async upsert(table, rows, conflict) {
    rows = [].concat(rows);
    if (!LIVE) {
      const keys = conflict.split(",");
      rows.forEach(r => {
        const ex = MEM[table].find(x => keys.every(k => x[k] === r[k]));
        if (ex) {
          const old = { ...ex }; Object.assign(ex, r);
          if (table === "branch_month_targets" && old.status === "approved" && ex.status === "approved" &&
              ["sales_target", "gp_pct_target", "staff_target", "ho_allocation"].some(k => +old[k] !== +ex[k])) {
            ex.version = (old.version || 1) + 1; ex.status = "pending"; ex.approved_by = null; ex.approved_at = null;
          }
          demoAudit(table, ex.id, "UPDATE", old, { ...ex });
        } else { const n = { id: nid(), ...r }; MEM[table].push(n); demoAudit(table, n.id, "INSERT", null, { ...n }); }
      });
      return;
    }
    const { error } = await sb.from(table).upsert(rows, { onConflict: conflict });
    if (error) throw error;
  },
  async insert(table, row) {
    if (!LIVE) { const n = { id: nid(), created_by: S.user.id, created_at: new Date().toISOString(), ...row }; MEM[table].push(n); demoAudit(table, n.id, "INSERT", null, { ...n }); return; }
    const { error } = await sb.from(table).insert(row); if (error) throw error;
  },
  async patch(table, id, patch) {
    if (!LIVE) { const ex = MEM[table].find(x => x.id === id); if (!ex) return; const old = { ...ex }; Object.assign(ex, patch); demoAudit(table, id, "UPDATE", old, { ...ex }); return; }
    const { error } = await sb.from(table).update(patch).eq("id", id); if (error) throw error;
  },
  async rpc(fn, args) {
    if (!LIVE) { if (fn === "request_reopen") return DB.patch("daily_closings", args.p_id, { status: "reopen_requested" }); return; }
    const { error } = await sb.rpc(fn, args); if (error) throw error;
  },
  async uploadBill(bid, date, hid, file) {
    if (!LIVE) return file.name;
    const path = `${bid}/${date}/${hid}-${Date.now()}-${file.name.replace(/[^\w.\-]/g, "_")}`;
    const { error } = await sb.storage.from("bills").upload(path, file);
    if (error) throw error; return path;
  }
};

async function loadAll() {
  const m = S.month, to = dateOf(m, daysIn(m)), role = S.user.role;
  const attOnly = ["hr", "hod"].includes(role);
  const [branches, departments, heads, mt, ht, cl, ex, ac] = await Promise.all([
    DB.list("branches"), DB.list("departments"), DB.list("expense_heads"),
    DB.list("branch_month_targets", { month: m }), DB.list("branch_head_targets", { month: m }),
    DB.list(attOnly ? "hr_attendance" : "daily_closings", { from: m, to }),
    role === "hr" ? [] : DB.list("daily_expenses", { from: m, to }),
    role === "hr" ? [] : DB.list("actions")
  ]);
  const D = S.D = { branches: branches.filter(b => b.active !== false).sort((a, b) => (a.category || "").localeCompare(b.category || "") || a.name.localeCompare(b.name)),
    departments, heads: heads.filter(h => h.active !== false).sort((a, b) => (a.sort || 0) - (b.sort || 0) || a.name.localeCompare(b.name)),
    mt, ht, closings: cl, expenses: ex, actions: ac, audit: [], profiles: [] };
  if (["md", "admin", "audit"].includes(role)) D.audit = await DB.list("audit_logs");
  if (["md", "admin"].includes(role)) D.profiles = await DB.list("profiles");
  D.days = daysIn(m);
  D.bById = Object.fromEntries(D.branches.map(b => [b.id, b]));
  D.hById = Object.fromEntries(D.heads.map(h => [h.id, h]));
  D.dById = Object.fromEntries(D.departments.map(d => [d.id, d]));
  D.mtB = Object.fromEntries(mt.map(r => [r.branch_id, r]));
  D.htBH = {}; ht.forEach(r => D.htBH[r.branch_id + "|" + r.expense_head_id] = +r.monthly_amount || 0);
  D.clBD = {}; cl.forEach(r => D.clBD[r.branch_id + "|" + r.date] = r);
  D.exBDH = {}; ex.forEach(r => D.exBDH[r.branch_id + "|" + r.date + "|" + r.expense_head_id] = r);
  D.salaryHead = D.heads.find(h => h.basis === "per_staff");
}

/* =====================================================================
   CALCULATIONS — the engine: target → actual → variance
   ===================================================================== */
function hs(h, t, a) { const v = a - t, vp = t ? v / t * 100 : (a > 0 ? 100 : 0);
  return { v, vp, st: vp > (h.red_pct ?? 10) ? "red" : vp > (h.amber_pct ?? 5) ? "amber" : "green" }; }
const salesSt = (a, t) => { const p = t ? a / t * 100 : 0; return p >= 100 ? "green" : p >= 90 ? "amber" : "red"; };
const costSt = (a, t) => { const vp = t ? (a - t) / t * 100 : 0; return vp > 10 ? "red" : vp > 5 ? "amber" : "green"; };

function dayCalc(bid, date) {
  const D = S.D, days = D.days, mt = D.mtB[bid] || {}, c = D.clBD[bid + "|" + date], has = !!c;
  const staffT = +mt.staff_target || 0, salesM = +mt.sales_target || 0;
  const sales = has ? (+c.sales || 0) : 0, gp = has ? (+c.gp_pct || 0) : 0, present = has ? (+c.present || 0) : 0;
  const salM = D.salaryHead ? (D.htBH[bid + "|" + D.salaryHead.id] || 0) : 0;
  const cph = staffT ? salM / days / staffT : 0;
  const heads = D.heads.map(h => {
    const m = D.htBH[bid + "|" + h.id] || 0; let t = m / days;
    if (has && h.basis === "sales_pct" && salesM) t = sales * m / salesM;
    if (has && h.basis === "per_attendance" && staffT) t = t * present / staffT;
    const e = D.exBDH[bid + "|" + date + "|" + h.id];
    let a = 0;
    if (e) a = +e.amount || 0;
    else if (has && h.basis === "per_staff") a = present * cph;
    else if (has && h.type === "fixed") a = t;
    return { h, t, a, e, ...hs(h, t, a) };
  });
  const sum = (f, k) => heads.filter(f).reduce((s, x) => s + x[k], 0);
  const fx = x => x.h.type === "fixed", vr = x => x.h.type === "variable";
  const salesT = salesM / days, gpT = +mt.gp_pct_target || 0, hoT = (+mt.ho_allocation || 0) / days;
  const fixedT = sum(fx, "t"), fixed = sum(fx, "a"), varT = sum(vr, "t"), vari = sum(vr, "a");
  const salRow = heads.find(x => x.h.basis === "per_staff");
  const x = { bid, date, has, c, mt, heads, n: has ? 1 : 0, salesT, sales, gpT, gp, gpAmtT: salesT * gpT / 100, gpAmt: sales * gp / 100,
    fixedT, fixed, varT, vari, totT: fixedT + varT, tot: fixed + vari, hoT, ho: has ? hoT : 0,
    staffT, present, onRoll: has ? (+c.staff_on_roll || 0) : 0, cph, salT: salRow ? salRow.t : 0, sal: salRow ? salRow.a : 0 };
  x.npT = x.gpAmtT - x.totT - x.hoT; x.np = has ? x.gpAmt - x.tot - x.ho : 0;
  return x;
}
function combine(xs) {
  const on = xs.filter(x => x.has);
  const keys = ["sales", "salesT", "gpAmt", "gpAmtT", "fixed", "fixedT", "vari", "varT", "tot", "totT", "ho", "hoT", "np", "npT", "present", "staffT", "onRoll", "sal", "salT"];
  const r = { has: on.length > 0, n: on.reduce((s, x) => s + (x.n || 0), 0) };
  keys.forEach(k => r[k] = on.reduce((s, x) => s + (x[k] || 0), 0));
  r.gp = r.sales ? r.gpAmt / r.sales * 100 : 0; r.gpT = r.salesT ? r.gpAmtT / r.salesT * 100 : 0;
  const m = {}; on.forEach(x => x.heads.forEach(y => { const k = y.h.id; m[k] = m[k] || { h: y.h, t: 0, a: 0 }; m[k].t += y.t; m[k].a += y.a; }));
  r.heads = S.D.heads.map(h => m[h.id]).filter(Boolean).map(y => ({ ...y, ...hs(y.h, y.t, y.a) }));
  return r;
}
function periodCalc(bid, upto) { const d = dayOf(upto), xs = []; for (let i = 1; i <= d; i++) xs.push(dayCalc(bid, dateOf(S.month, i)));
  const r = combine(xs); r.d = d; r.bid = bid; r.mt = S.D.mtB[bid] || {}; return r; }
const calcFor = bid => S.mtd ? periodCalc(bid, S.date) : dayCalc(bid, S.date);
function bSt(x) { if (!x.has) return "pending";
  const ach = x.salesT ? x.sales / x.salesT * 100 : 100, cv = x.totT ? (x.tot - x.totT) / x.totT * 100 : 0;
  if (ach < 90 || cv > 10 || x.np < 0) return "red"; if (ach < 100 || cv > 5) return "amber"; return "green"; }

const TIPS = { "Electricity": "Review AC usage, lighting zones and operating hours.", "Food/Mess": "Reconcile meal count with attendance and check quantity.",
  "Maintenance": "Check whether the repair was planned and verify the bill.", "Water": "Check for leaks and tanker purchases.",
  "Travelling": "Check trip purpose and approvals.", "Advertisement": "Confirm spend is within the approved marketing budget.",
  "Sales Incentive": "Incentive should move with sales; recheck the calculation.", "Bank Charges": "Review card and UPI charges and cash deposit fees." };

function alerts(x) {
  if (!x.has) return [{ st: "amber", t: "Daily closing pending", d: "No closing has been entered for this period yet." }];
  const out = [], ach = x.salesT ? x.sales / x.salesT * 100 : 0, sv = x.sales - x.salesT;
  out.push(sv >= 0 ? { st: "green", t: "Sales above target", d: `Sales ${short(sv)} above target (${pct(ach, 0)}).` }
    : { st: salesSt(x.sales, x.salesT), t: "Sales below target", d: `Sales ${short(-sv)} short of target (${pct(ach, 0)}). Push conversion and evening footfall.` });
  if (x.gpT) { const g = x.gp - x.gpT;
    out.push(g < -0.5 ? { st: g < -2 ? "red" : "amber", t: "GP below target", d: `GP ${pct(x.gp)} against ${pct(x.gpT)}. Check discounting and product mix.` }
      : { st: "green", t: "GP on target", d: `GP ${pct(x.gp)} against ${pct(x.gpT)}.` }); }
  if (x.staffT) { const att = x.present / x.staffT * 100, gap = Math.round(x.staffT - x.present);
    if (att < 95) out.push({ st: att < 90 ? "red" : "amber", t: "Attendance below plan", d: `Attendance ${pct(att)}, ${gap} ${x.n > 1 ? "person-days" : "staff"} below planned manpower. Review deployment, leave and absence.` }); }
  x.heads.filter(y => y.st !== "green").sort((a, b) => b.v - a.v).forEach(y =>
    out.push({ st: y.st, t: `${y.h.name} above target`, d: `${short(y.v)} over target (${pct(y.vp, 0)}). ${TIPS[y.h.name] || "Review the entries and reasons."}`, hid: y.h.id, v: y.v }));
  const sal = x.heads.find(y => y.h.basis === "per_staff");
  if (sal && sal.v < -1) out.push({ st: "green", t: "Salary cost below target", d: `${short(-sal.v)} under the salary budget.` });
  const o = { red: 0, amber: 1, green: 2 }; return out.sort((a, b) => o[a.st] - o[b.st]);
}

function closingCheck() {
  const f = $("#cform"); if (!f || !f.present) return false;
  const present = num(f.present.value), sales = num(f.sales.value), staffT = num(f.dataset.staff), days = num(f.dataset.days), salesM = num(f.dataset.salesm), cph = num(f.dataset.cph);
  let needR = 0, needB = 0;
  f.querySelectorAll("tr[data-h]").forEach(tr => {
    const m = num(tr.dataset.m), basis = tr.dataset.basis; let t = m / days;
    if (basis === "sales_pct" && salesM) t = sales * m / salesM;
    if (basis === "per_attendance" && staffT) t = t * present / staffT;
    tr.querySelector(".tt").textContent = inr(t);
    const inp = tr.querySelector(".amt"); if (basis === "per_staff") inp.value = Math.round(present * cph);
    const a = num(inp.value), vp = t ? (a - t) / t * 100 : (a > 0 ? 100 : 0);
    const st = vp > num(tr.dataset.red) ? "red" : vp > num(tr.dataset.amber) ? "amber" : "green";
    tr.querySelector(".vs").innerHTML = inp.value !== "" ? `<span class="${st}">${vp > 0 ? "+" : ""}${vp.toFixed(0)}%</span>` : "";
    if (tr.dataset.type === "variable") {
      const r = tr.querySelector(".rsn"); if (st !== "green" && a > 0 && !(r && r.value.trim())) needR++;
      const fi = tr.querySelector(".bill"); if (a > num(tr.dataset.bill) && !(fi && fi.files && fi.files.length) && !tr.dataset.hasbill) needB++;
    }
  });
  const onroll = num(f.staff_on_roll.value), lv = num(f.on_leave.value), ab = num(f.absent.value);
  const items = [["Attendance entered", present > 0], [`Present + leave + absent = staff on roll (${present + lv + ab} of ${onroll})`, present + lv + ab === onroll],
    ["Sales entered", sales > 0], ["GP % entered", num(f.gp_pct.value) > 0],
    [needR ? `Reason missing on ${needR} over-target head${needR > 1 ? "s" : ""}` : "Reasons given for over-target heads", !needR],
    [needB ? `Bill missing on ${needB} large expense${needB > 1 ? "s" : ""}` : "Bills attached for large expenses", !needB]];
  const ok = items.every(i => i[1]);
  const cl = $("#checklist"); if (cl) cl.innerHTML = items.map(([l, o]) => `<li class="${o ? "ok" : ""}">${esc(l)}</li>`).join("");

  return ok;
}

      const fi = tr.querySelector(".bill"); if (fi && fi.files && fi.files[0]) bill = await DB.uploadBill(bid, date, hid, fi.files[0]);
      rows.push({ branch_id: bid, date, expense_head_id: hid, amount: num(inp.value), reason: (tr.querySelector(".rsn") || {}).value || null, bill_path: bill });
    }
    if (rows.length) await DB.upsert("daily_expenses", rows, "branch_id,date,expense_head_id");
    const c = { branch_id: bid, date, staff_on_roll: int(f.staff_on_roll.value), present: int(f.present.value), on_leave: int(f.on_leave.value), absent: int(f.absent.value),
      sales: num(f.sales.value), gp_pct: num(f.gp_pct.value), bills: int(f.bills.value), remarks: f.remarks.value || null, status: submit ? "submitted" : "draft" };
    if (submit) { c.submitted_by = S.user.id; c.submitted_at = new Date().toISOString(); }
    await DB.upsert("daily_closings", c, "branch_id,date");
    await loadAll(); go(submit ? "branch:" + bid : "closing:" + bid); toast(submit ? "Daily closing submitted" : "Draft saved");
  },
  async reqReopen(el) { await DB.rpc("request_reopen", { p_id: el.dataset.id }); await reload("Correction requested"); },
  async reopen(el) { await DB.patch("daily_closings", el.dataset.id, { status: "draft" }); await reload("Day reopened for correction"); },
  async saveAction() { const f = $("#aform"), v = rowVals(f); if (!v.title.trim()) { toast("Describe the action first"); return; }
    await DB.insert("actions", { title: v.title.trim(), branch_id: v.branch_id || null, expense_head_id: v.expense_head_id || null, variance: v.variance ? num(v.variance) : null,
      owner_role: v.owner_role, due_date: v.due_date || null, note: v.note || null, status: "open", date: S.date });
    await loadAll(); go("actions"); toast("Action created"); },
  async actStatus(el) { await DB.patch("actions", el.dataset.id, { status: el.dataset.s }); await reload("Action updated"); },
  async saveTargets(el) {
    const f = $("#tform"), bid = f.dataset.bid, mt = { branch_id: bid, month: S.month, sales_target: num(f.sales_target.value), gp_pct_target: num(f.gp_pct_target.value),
      staff_target: int(f.staff_target.value), ho_allocation: num(f.ho_allocation.value) };
    if (el.dataset.status) mt.status = el.dataset.status;
    if (mt.status === "approved") { mt.approved_by = S.user.id; mt.approved_at = new Date().toISOString(); }
    await DB.upsert("branch_month_targets", mt, "branch_id,month");
    await DB.upsert("branch_head_targets", S.D.heads.map(h => ({ branch_id: bid, month: S.month, expense_head_id: h.id, monthly_amount: num(f["h_" + h.id].value) })), "branch_id,month,expense_head_id");
    await reload(mt.status === "approved" ? "Targets approved" : mt.status === "pending" ? "Sent for approval" : "Targets saved"); },
  async copyPrev() { const f = $("#tform"), bid = f.dataset.bid, pm = prevMonth(S.month);
    const [m, h] = await Promise.all([DB.list("branch_month_targets", { month: pm }), DB.list("branch_head_targets", { month: pm })]);
    const mt = m.find(r => r.branch_id === bid); if (!mt) { toast("No targets found for " + fmtMonth(pm)); return; }
    ["sales_target", "gp_pct_target", "staff_target", "ho_allocation"].forEach(k => f[k].value = mt[k]);
    h.filter(r => r.branch_id === bid).forEach(r => { const i = f["h_" + r.expense_head_id]; if (i) i.value = r.monthly_amount; });
    refreshTargets(); toast("Copied from " + fmtMonth(pm) + ". Review, then save."); },
  async saveHod() { const rows = []; document.querySelectorAll("#hform input:not([disabled])").forEach(i => { if (i.value !== "") rows.push({ branch_id: i.dataset.b, month: S.month, expense_head_id: i.dataset.h, monthly_amount: num(i.value) }); });
    if (!rows.length) { toast("Nothing to save"); return; } await DB.upsert("branch_head_targets", rows, "branch_id,month,expense_head_id"); await reload("Proposals saved"); },
  async saveHead(el) { const v = rowVals(el.closest("tr")); await DB.patch("expense_heads", el.dataset.id, { type: v.type, basis: v.basis, department_id: v.department_id || null, amber_pct: num(v.amber_pct), red_pct: num(v.red_pct), bill_required_above: num(v.bill_required_above) }); await reload("Head saved"); },
  async addHead(el) { const v = rowVals(el.closest("tr")); if (!v.name.trim()) { toast("Enter a head name"); return; }
    await DB.insert("expense_heads", { name: v.name.trim(), type: v.type, basis: v.basis, department_id: v.department_id || null, amber_pct: num(v.amber_pct), red_pct: num(v.red_pct), bill_required_above: num(v.bill_required_above), sort: S.D.heads.length + 1, active: true }); await reload("Head added"); },
  async addBranch(el) { const v = rowVals(el.closest("tr")); if (!v.code.trim() || !v.name.trim()) { toast("Enter code and name"); return; }
    await DB.insert("branches", { code: v.code.trim().toUpperCase(), name: v.name.trim(), category: v.category || null, active: true }); await reload("Branch added"); },
  async saveUser(el) { const v = rowVals(el.closest("tr")); await DB.patch("profiles", el.dataset.id, { role: v.role, branch_id: v.branch_id || null, department_id: v.department_id || null }); await reload("User saved"); }
};

document.addEventListener("click", async e => {
  const g = e.target.closest("[data-go]"); const a = e.target.closest("[data-act]");
  if (a && (!g || g.contains(a))) { e.preventDefault(); try { await ACT[a.dataset.act] && ACT[a.dataset.act](a, e); } catch (err) { console.error(err); toast(err.message || "Could not save"); a.disabled = false; } return; }
  if (g) { e.preventDefault(); go(g.dataset.go); }
});
document.addEventListener("change", async e => {
  const t = e.target;
  if (t.id === "dateSel" && t.value) { const m = monthOf(t.value); S.date = t.value; if (m !== S.month) { S.month = m; await loadAll(); } render(); return; }
  if (t.dataset && t.dataset.nav) { go(t.dataset.nav + ":" + t.value); return; }
  if (t.closest("#cform")) closingCheck();
});
document.addEventListener("input", e => { if (e.target.closest("#cform")) closingCheck(); if (e.target.closest("#tform")) refreshTargets(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") modal(""); });

async function afterLogin(u) {
  const { data, error } = await sb.from("profiles").select("*").eq("id", u.id).single();
  if (error || !data) { toast("Profile not found. Ask the MD to check your account."); return; }
  S.user = data; S.date = todayStr(); S.month = monthOf(S.date);
  if (data.role !== "pending") { await loadAll(); S.view = homeView(data.role); }
  render();
}

/* =====================================================================
   DEMO DATA — September 2026, ten branches
   ===================================================================== */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function seedDemo() {
  const R = mulberry32(20260930), M = MEM;
  ["HR", "Accounts & Finance", "Purchase", "Sales", "Marketing", "Administration", "Operations", "Inventory", "Audit", "IT", "Security & CCTV", "VM", "Social Media", "Transportation", "MD Office"]
    .forEach(n => M.departments.push({ id: nid(), name: n }));
  const dep = n => M.departments.find(d => d.name === n).id;
  [["Shop Rent", "fixed", "monthly", "Administration", 2, 5], ["Staff Quarters Rent", "fixed", "monthly", "Administration", 2, 5], ["Parking Rent", "fixed", "monthly", "Administration", 2, 5],
   ["Salary", "fixed", "per_staff", "HR", 3, 6], ["PF/ESI", "fixed", "monthly", "HR", 3, 6], ["Security", "fixed", "monthly", "Security & CCTV", 3, 8], ["Telephone/Internet", "fixed", "monthly", "IT", 5, 10],
   ["Electricity", "variable", "monthly", "Administration", 5, 10], ["Food/Mess", "variable", "per_attendance", "Administration", 5, 10], ["Maintenance", "variable", "monthly", "Administration", 10, 20],
   ["Water", "variable", "monthly", "Administration", 10, 20], ["Travelling", "variable", "monthly", "Operations", 10, 20], ["Bank Charges", "variable", "sales_pct", "Accounts & Finance", 5, 10],
   ["Advertisement", "variable", "monthly", "Marketing", 5, 10], ["Sales Incentive", "variable", "sales_pct", "Sales", 5, 10]]
    .forEach(([name, type, basis, d, amber, red], i) => M.expense_heads.push({ id: nid(), name, type, basis, department_id: dep(d), amber_pct: amber, red_pct: red, bill_required_above: 5000, sort: i + 1, active: true }));
  const REASONS = { "Electricity": "Extended AC hours", "Food/Mess": "Extra staff for rush", "Maintenance": "Minor repairs", "Water": "Tanker water purchased", "Travelling": "Stock transfer trip", "Advertisement": "Local newspaper ad" };
  const month = "2026-09-01", days = 30;
  [["PMNA", "Perinthalmanna", "A", 4.00], ["KLM", "Kollam", "A", 3.23], ["KDKL", "Kadakkal", "A", 2.93], ["NLB", "Nilambur", "A", 2.66], ["KDVL", "Koduvalli", "A", 2.50],
   ["KTM", "Kothamangalam", "B", 2.00], ["PBVR", "Perumbavoor", "B", 2.00], ["KADS", "KADS", "B", 1.25], ["GSQ", "Gandhisquare", "C", 1.20], ["MVPA", "MVPA", "C", 1.00]]
  .forEach(([code, name, cat, dl]) => {
    const b = { id: nid(), code, name, category: cat, active: true }; M.branches.push(b);
    const f = dl / 4, staff = Math.round(dl * 22), cph = Math.round(470 + 75 * f), salesM = Math.round(dl * 1e5 * days);
    const amt = { "Shop Rent": 300000 * f, "Staff Quarters Rent": 60000 * f, "Parking Rent": 15000 * f, "Salary": staff * cph * days, "PF/ESI": .12 * staff * cph * days, "Security": 45000 * f,
      "Telephone/Internet": 9000, "Electricity": 150000 * f, "Food/Mess": staff * 55 * days, "Maintenance": 45000 * f, "Water": 12000 * f, "Travelling": 18000 * f, "Bank Charges": .004 * salesM,
      "Advertisement": 90000 * f, "Sales Incentive": .01 * salesM };
    M.branch_month_targets.push({ id: nid(), branch_id: b.id, month, sales_target: salesM, gp_pct_target: 35, staff_target: staff, ho_allocation: Math.round(.025 * salesM), status: code === "KADS" ? "pending" : "approved", version: 1 });
    M.expense_heads.forEach(h => M.branch_head_targets.push({ id: nid(), branch_id: b.id, month, expense_head_id: h.id, monthly_amount: Math.round(amt[h.name] || 0) }));
    const weak = cat === "A" ? 1 : .88;
    for (let d = 1; d <= days; d++) {
      const date = dateOf(month, d); if (d === 30 && code === "KLM") continue;
      const dow = new Date(Date.UTC(2026, 8, d)).getUTCDay(), fac = dow === 0 ? 1.35 : dow === 6 ? 1.2 : .9;
      let sales = Math.round(dl * 1e5 * fac * weak * (.82 + R() * .36)), gp = +(33.4 + R() * 3.2).toFixed(1), leave = Math.floor(R() * 4), absent = Math.floor(R() * 3);
      if (d === 30 && code === "PMNA") { sales = 535000; gp = 35.8; leave = 4; absent = 2; }
      const present = staff - leave - absent, status = d === 30 && code === "KADS" ? "draft" : "submitted";
      M.daily_closings.push({ id: nid(), branch_id: b.id, date, staff_on_roll: staff, present, on_leave: leave, absent, sales, gp_pct: gp, bills: Math.round(sales / 1300), remarks: "", status,
        submitted_by: status === "submitted" ? "u-bm" : null, submitted_at: status === "submitted" ? date + "T16:45:00Z" : null });
      M.expense_heads.forEach(h => {
        let t = amt[h.name] / days, a, reason = "";
        if (h.basis === "per_attendance") t = t * present / staff;
        if (h.basis === "per_staff") a = present * cph; else if (h.type === "fixed") a = t;
        else if (h.name === "Sales Incentive") a = sales * .01 * (.97 + R() * .06); else if (h.name === "Bank Charges") a = sales * .004 * (.95 + R() * .1);
        else { let m = .82 + R() * .3; if (h.name === "Electricity" && (code === "PMNA" || code === "NLB")) m = 1.06 + R() * .25;
          if (h.name === "Maintenance" && R() < .08) { m = 2.6 + R(); reason = "AC compressor repair"; } a = t * m; }
        if (d === 30 && code === "PMNA") { if (h.name === "Electricity") { a = 6500; reason = "Extended hours for festive rush, AC ran till 10 PM"; } if (h.name === "Maintenance") { a = 1770; reason = "Escalator belt adjustment"; } }
        if (!reason && h.type === "variable" && a > t * 1.05) reason = REASONS[h.name] || "Higher activity today";
        M.daily_expenses.push({ id: nid(), branch_id: b.id, date, expense_head_id: h.id, amount: Math.round(a), reason: reason || null, bill_path: h.type === "variable" && a > 5000 ? "bill.jpg" : null });
      });
    }
  });
  const B = c => M.branches.find(b => b.code === c).id, H = n => M.expense_heads.find(h => h.name === n).id;
  M.profiles.push({ id: "u-md", full_name: "MD office", role: "md" }, { id: "u-admin", full_name: "Admin office", role: "admin" },
    { id: "u-bm", full_name: "Branch manager", role: "branch_manager", branch_id: B("PMNA") }, { id: "u-hod", full_name: "HOD, Administration", role: "hod", department_id: dep("Administration") },
    { id: "u-hr", full_name: "HR head", role: "hr" }, { id: "u-acc", full_name: "Accounts", role: "accounts" }, { id: "u-aud", full_name: "Internal audit", role: "audit" });
  M.actions.push(
    { id: nid(), branch_id: B("PMNA"), expense_head_id: H("Electricity"), date: "2026-09-30", title: "Cut electricity overrun at Perinthalmanna", variance: 1500, owner_role: "branch_manager", due_date: "2026-10-02", status: "open", note: "Check AC timer and switch off unused lighting zones after 9 PM", created_by: "u-admin" },
    { id: nid(), branch_id: B("NLB"), expense_head_id: H("Electricity"), date: "2026-09-24", title: "Nilambur electricity running above target all month", variance: 18500, owner_role: "hod", due_date: "2026-09-28", status: "in_progress", note: "Electrician to check meter and AC load", created_by: "u-hod" },
    { id: nid(), branch_id: B("KLM"), expense_head_id: null, date: "2026-09-30", title: "Daily closing not submitted", variance: null, owner_role: "branch_manager", due_date: "2026-10-01", status: "open", note: "", created_by: "u-admin" },
    { id: nid(), branch_id: B("KTM"), expense_head_id: H("Maintenance"), date: "2026-09-18", title: "Verify AC compressor repair bill", variance: 3200, owner_role: "admin", due_date: "2026-09-22", status: "completed", note: "Bill verified with vendor quote", created_by: "u-admin" });
  M.audit_logs.push({ id: nid(), table_name: "branch_month_targets", row_id: "", action: "UPDATE", user_id: "u-admin", at: "2026-09-01T05:10:00Z",
    old_data: { staff_target: 86, status: "pending" }, new_data: { staff_target: 88, status: "approved" } });
}

  if (!LIVE) seedDemo();
  else { const { data } = await sb.auth.getSession(); if (data && data.session) { await afterLogin(data.session.user); return; } }

})();
